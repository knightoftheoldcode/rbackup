name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: 0.11.0
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: |
          curl -fsSL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf shellcheck.tar.xz "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          sudo install "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
      - run: shellcheck bin/rbackup bin/rbackup-setup

  validate-config:
    runs-on: ubuntu-latest
    env:
      RESTICPROFILE_VERSION: 0.33.1
      RESTIC_VERSION: 0.19.1
    steps:
      - uses: actions/checkout@v4
      - name: install resticprofile and restic
        run: |
          curl -fsSL -o resticprofile.tar.gz \
            "https://github.com/creativeprojects/resticprofile/releases/download/v${RESTICPROFILE_VERSION}/resticprofile_${RESTICPROFILE_VERSION}_linux_amd64.tar.gz"
          tar -xzf resticprofile.tar.gz resticprofile
          sudo install resticprofile /usr/local/bin/resticprofile

          curl -fsSL -o restic.bz2 \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          bunzip2 restic.bz2
          sudo install restic /usr/local/bin/restic
      - name: render and validate config/*.toml.tmpl
        run: |
          # Mirrors bin/rbackup-setup's render(), with placeholder values
          # standing in for what setup fills in from the install and 1Password.
          render() {
            sed -e "s|@@ID@@|test-id|g" -e "s|@@HOME@@|/home/test|g" \
              -e "s|@@CONF@@|$RUNNER_TEMP/conf|g" -e "s|@@RBACKUP@@|$PWD|g" \
              -e "s|@@OS@@|$1|g" -e "s|@@LOGS@@|$RUNNER_TEMP/logs|g" \
              -e "s|@@SCHEDULE_PERMISSION@@|$3|g" -e "s|@@AFTER_NETWORK_ONLINE@@|$4|g" \
              -e "s|@@HC_URL@@|https://hc-ping.com/test|g" "$2"
          }
          for os in macos linux; do
            permission=user after_network=true
            [[ $os == linux ]] && permission=user_logged_on after_network=false
            for hc in with without; do
              profile=$(render "$os" config/profiles.toml.tmpl "$permission" "$after_network")
              healthcheck=""
              [[ $hc == with ]] && healthcheck=$(render "$os" config/healthcheck.toml.tmpl "$permission" "$after_network")
              rendered="${profile//@@HEALTHCHECK@@/$healthcheck}"
              out="$RUNNER_TEMP/profiles-$os-$hc.toml"
              printf '%s\n' "$rendered" >"$out"
              echo "--- $os / healthcheck $hc ---"
              resticprofile --config "$out" --name home show
            done
          done
        shell: bash
